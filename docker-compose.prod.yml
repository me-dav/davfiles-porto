name: Davvfiles

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./env/db.env
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5

  app:
    image: ghcr.io/me-dav/webprofile-app:${TAG:-latest}
    restart: unless-stopped
    env_file: ./env/app.env
    depends_on:
      db: { condition: service_healthy }
    volumes: [storage:/var/www/html/storage/app]
    networks: [internal]
    mem_limit: 384m

  nginx:
    image: ghcr.io/me-dav/webprofile-nginx:${TAG:-latest}
    restart: unless-stopped
    depends_on: [app]
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage/app:ro
    networks: [internal]
    mem_limit: 64m

  web:
    image: ghcr.io/USERNAME/webprofile-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://nginx
    depends_on: [nginx]
    ports: ["127.0.0.1:3010:3000"]
    networks: [internal]
    mem_limit: 384m

networks:
  internal: {}

volumes:
  pgdata:
  storage: