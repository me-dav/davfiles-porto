name: rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag tujuan (mis. v6)'
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Siapkan SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Deploy ulang tag lama
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          TAG: ${{ inputs.tag }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER_@$HOST" "$TAG"
